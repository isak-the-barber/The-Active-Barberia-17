<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Active Barberia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* HERO SECTION */
    .hero {
      background: linear-gradient(to right, #0a2540, #b1e4a4);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-top: 20px;
    }

    .hero img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    /* SERVICES SECTION */
    .services {
      padding: 50px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .services h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 30px;
      color: #0a2540;
    }

    .services table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .services th, .services td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    .services th {
      background: #0a2540;
      color: white;
    }

    .note {
      text-align: center;
      font-style: italic;
      color: #555;
    }

    /* GALLERY SECTION */
    .gallery {
      padding: 50px 20px;
      background: #f8f8f8;
      text-align: center;
    }

    .gallery h2 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #0a2540;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery-grid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
 
.gallery-grid img:hover {
  opacity: 0.8;
  transform: scale(1.05);
}
.lightbox {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
}
.lightbox-content {
  margin: auto;
  display: block;
  max-width: 90%;
  max-height: 90%;
  margin-top: 5%;
}
.close {
  position: absolute;
  top: 20px;
  right: 35px;
  color: #fff;
  font-size: 40px;
  cursor: pointer;
}
.prev, .next {
  position: absolute;
  top: 50%;
  color: white;
  font-size: 40px;
  padding: 16px;
  cursor: pointer;
  user-select: none;
}
.next { right: 0; }
.prev { left: 0; }
 </style>
</head>
<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <img src="logo.jpg" alt="The Active Barberia Logo">
    <h1>The Active Barberia</h1>
  </section>

  <!-- SERVICES SECTION -->
  <section class="services">
    <h2>Our Services</h2>
    <table>
      <tr><th>Service</th><th>Price</th></tr>
      <tr><td>Adults Haircut - Normal</td><td>N$80</td></tr>
      <tr><td>Adults Haircut - With Gold Black</td><td>N$140</td></tr>
      <tr><td>Kids Haircut - Normal</td><td>N$50</td></tr>
      <tr><td>Kids Haircut - With Gold Black</td><td>N$70</td></tr>
    </table>
    <p class="note">Walk-ins welcome • Open Daily 8AM-10PM</p>
  </section>

  <!-- GALLERY SECTION -->
<section class="gallery">
  <h2>Our Work</h2>
  <div class="gallery-grid">
    <img src="gallery1.jpg" alt="The Active Barberia cut 1" onclick="openLightbox(1)">
    <img src="gallery3.jpg" alt="The Active Barberia cut 3" onclick="openLightbox(3)">
    <img src="gallery4.jpg" alt="The Active Barberia cut 4" onclick="openLightbox(4)">
    <img src="gallery5.jpg" alt="The Active Barberia cut 5" onclick="openLightbox(5)">
    <img src="gallery6.jpg" alt="The Active Barberia cut 6" onclick="openLightbox(6)">
    <img src="gallery7.jpg" alt="The Active Barberia cut 7" onclick="openLightbox(7)">
    <img src="gallery8.jpg" alt="The Active Barberia cut 8" onclick="openLightbox(8)">
    <img src="gallery9.jpg" alt="The Active Barberia cut 9" onclick="openLightbox(9)">
    <img src="gallery10.jpg" alt="The Active Barberia cut 10" onclick="openLightbox(10)">
    <img src="gallery11.jpg" alt="The Active Barberia cut 11" onclick="openLightbox(11)">
    <img src="gallery12.jpg" alt="The Active Barberia cut 12" onclick="openLightbox(12)">
    <img src="gallery13.jpg" alt="The Active Barberia cut 13" onclick="openLightbox(13)">
    <img src="gallery14.jpg" alt="The Active Barberia cut 14" onclick="openLightbox(14)">
    <img src="gallery15.jpg" alt="The Active Barberia cut 15" onclick="openLightbox(15)">
    <img src="gallery16.jpg" alt="The Active Barberia cut 16" onclick="openLightbox(16)">
    <img src="gallery17.jpg" alt="The Active Barberia cut 17" onclick="openLightbox(17)">
    <img src="gallery18.jpg" alt="The Active Barberia cut 18" onclick="openLightbox(18)">
    <img src="gallery19.jpg" alt="The Active Barberia cut 19" onclick="openLightbox(19)">
  </div>
</section>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <img class="lightbox-content" id="lightbox-img">
  <a class="prev" onclick="changeSlide(-1); event.stopPropagation();">&#10094;</a>
  <a class="next" onclick="changeSlide(1); event.stopPropagation();">&#10095;</a>
</div>
 <script>
    let currentSlide = 1;
    function openLightbox(n) {
      document.getElementById("lightbox").style.display = "block";
      document.getElementById("lightbox-img").src = "gallery" + n + ".jpg";
      currentSlide = n;
    }
    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }
    function changeSlide(n) {
      currentSlide += n;
      if (currentSlide > 19) currentSlide = 1;
      if (currentSlide < 1) currentSlide = 19;
      document.getElementById("lightbox-img").src = "gallery" + currentSlide + ".jpg";
    }
  </script>

</body>
</html>

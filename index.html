<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Active Barberia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* HERO SECTION */
    .hero {
      background: linear-gradient(to right, #0a2540, #b1e4a4f);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-top: 20px;
    }

    .hero img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    /* SERVICES SECTION */
    .services {
      padding: 50px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .services h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 30px;
      color: #0a2540;
    }

    .services table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .services th, .services td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    .services th {
      background: #0a2540;
      color: white;
    }

    .note {
      text-align: center;
      font-style: italic;
      color: #555;
    }

    /* GALLERY SECTION */
    .gallery {
      padding: 50px 20px;
      background: #f8f8f8;
      text-align: center;
    }

    .gallery h2 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #0a2540;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery-grid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <img src="logo.jpg" alt="The Active Barberia Logo">
    <h1>The Active Barberia</h1>
  </section>

  <!-- SERVICES SECTION -->
  <section class="services">
    <h2>Our Services</h2>
    <table>
      <tr><th>Service</th><th>Price</th></tr>
      <tr><td>Adults Haircut - Normal</td><td>N$80</td></tr>
      <tr><td>Adults Haircut - With Gold Black</td><td>N$140</td></tr>
      <tr><td>Kids Haircut - Normal</td><td>N$50</td></tr>
      <tr><td>Kids Haircut - With Gold Black</td><td>N$70</td></tr>
    </table>
    <p class="note">Walk-ins welcome • Open Daily 8AM-10PM</p>
  </section>

  <!-- GALLERY SECTION -->
 <section class="gallery">
  <h2>Our Shop</h2>
  <div class="gallery-grid">
    <img src="https://images.unsplash.com/photo-1621607510804-6bdb740cb7b4?w=500" alt="Barber Chair">
    <img src="https://images.unsplash.com/photo-1585747860715-2f2e4387e553?w=500" alt="Haircut Service">
    <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=500" alt="Shop Interior">
  </div>
</section>
